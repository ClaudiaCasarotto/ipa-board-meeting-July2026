<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IPA Board Meeting – Access</title>
  <style>
    :root {
      --green:      #49ac57;
      --dark-green: #155240;
      --light-blue: #84d0d4;
      --light-gray: #f1f2f2;
      --dark-gray:  #c9c9c8;
      --charcoal:   #414042;
      --white:      #ffffff;
      --font-display: Georgia, 'Times New Roman', serif;
      --font-body:    Arial, Helvetica, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--dark-green);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--white);
      border-radius: 10px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.25);
    }
    .logo {
      font-family: var(--font-display);
      font-size: 1.15rem;
      color: var(--dark-green);
      margin-bottom: .3rem;
    }
    .logo span { color: var(--green); font-weight: bold; }
    .subtitle {
      font-size: .78rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: .8rem;
      font-weight: bold;
      color: var(--charcoal);
      text-align: left;
      margin-bottom: .4rem;
    }
    input[type="password"] {
      width: 100%;
      padding: .65rem .9rem;
      border: 1px solid var(--dark-gray);
      border-radius: 5px;
      font-size: .95rem;
      font-family: var(--font-body);
      color: var(--charcoal);
      outline: none;
      transition: border-color .15s;
      margin-bottom: 1rem;
    }
    input[type="password"]:focus { border-color: var(--green); }
    button {
      width: 100%;
      padding: .7rem;
      background: var(--dark-green);
      color: var(--white);
      border: none;
      border-radius: 5px;
      font-size: .9rem;
      font-family: var(--font-body);
      font-weight: bold;
      cursor: pointer;
      letter-spacing: .04em;
      transition: background .15s;
    }
    button:hover { background: var(--green); }
    .error {
      display: none;
      margin-top: .85rem;
      font-size: .82rem;
      color: #c0392b;
      background: #fdebd0;
      padding: .5rem .75rem;
      border-radius: 4px;
    }
    .error.visible { display: block; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">IPA &nbsp;<span>Board Meeting</span></div>
  <div class="subtitle">Nairobi, Kenya &nbsp;·&nbsp; July 2026</div>

  <label for="pwd">Enter password to access materials</label>
  <input type="password" id="pwd" placeholder="Password" autofocus
         onkeydown="if(event.key==='Enter') checkPassword()"/>
  <button onclick="checkPassword()">Access site →</button>
  <div class="error" id="error">Incorrect password. Please try again.</div>
</div>

<script>
  // If already authenticated this session, go straight to homepage
  if (sessionStorage.getItem('ipa_auth') === 'true') {
    window.location.href = 'index.html';
  }

  function checkPassword() {
    const input = document.getElementById('pwd').value;
    if (input === 'IPAJuly2026') {
      sessionStorage.setItem('ipa_auth', 'true');
      window.location.href = 'index.html';
    } else {
      document.getElementById('error').classList.add('visible');
      document.getElementById('pwd').value = '';
      document.getElementById('pwd').focus();
    }
  }
</script>

</body>
</html>
